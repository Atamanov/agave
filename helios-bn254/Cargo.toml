[package]
name = "helios-bn254"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agave-aligned, variable-time BN254 batch arithmetic with portable Rust, AArch64, x86-64 ADX, and AVX-512 IFMA backends"
readme = "README.md"
homepage = "https://github.com/helios/helios-bn254"
documentation = "https://docs.rs/helios-bn254"
keywords = ["bn254", "pairing", "zk", "elliptic-curve", "cryptography"]
categories = ["cryptography", "no-std"]

[features]
# no_std + alloc by default: this drops into on-chain and syscall contexts.
# `std` is opt-in and only pulls the test/timing harness; run the test suite
# with `--features std`.
default = []
std = []
# Compile the portable Rust field kernel even on AArch64. This is an explicit
# benchmark/test tier; it never silently selects assembly.
force-portable = []

[dependencies]
bytemuck = { workspace = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = { version = "=0.5.0", features = ["asm"] }
criterion = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "pairing"
harness = false

[[bench]]
name = "field"
harness = false

[[bench]]
name = "agave_workloads"
harness = false

[[bench]]
name = "gt_map_scenarios"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
