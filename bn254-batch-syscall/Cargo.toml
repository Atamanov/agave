[package]
name = "solana-bn254-batch-syscall"
description = "Solana alt_bn128 G1 MSM and boolean multi-pairing check syscalls"
documentation = "https://docs.rs/solana-bn254-batch-syscall"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
agave-unstable-api = []

[dependencies]
# arkworks stays a full dependency: the pod types' arkworks conversion methods
# are public API consumed by the groth16/plonk verifier crates outside tests
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
bytemuck = { workspace = true, features = ["extern_crate_alloc", "min_const_generics"] }
bytemuck_derive = { workspace = true }
# sibling checkout, deliberately non-portable; see README.md
helios-bn254 = { path = "../../helios-bn254-2/crates/helios-bn254", default-features = false, features = ["std"] }
thiserror = { workspace = true }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }
solana-bn254 = { workspace = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
