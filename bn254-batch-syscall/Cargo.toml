[package]
name = "solana-bn254-batch-syscall"
description = "Solana alt_bn128 G1 MSM and boolean multi-pairing check syscalls"
documentation = "https://docs.rs/solana-bn254-batch-syscall"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[features]
agave-unstable-api = []

[dependencies]
bytemuck = { workspace = true, features = ["min_const_generics"] }
bytemuck_derive = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { workspace = true }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }
solana-bn254 = { workspace = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
