[package]
name = "solana-bn254-batch-syscall"
description = "Solana BN254 batch syscall interfaces and native backends"
documentation = "https://docs.rs/solana-bn254-batch-syscall"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true
features = ["agave-unstable-api", "backend-b1-arkworks"]

[features]
# B1 remains the fallback when a workspace dependency disables default features.
default = ["backend-b1-arkworks"]
agave-unstable-api = []
research-observer = []
backend-b1-arkworks = []
backend-b2-arkworks-optimized = []
backend-b3-mcl = ["dep:solana-bn254-mcl-sys"]
backend-b4-helius = ["dep:helius-bn254", "helius-bn254/std", "helius-bn254/deny-ifma"]
backend-b5-helius-ifma = ["dep:helius-bn254", "helius-bn254/std", "helius-bn254/force-ifma"]

[dependencies]
bytemuck = { workspace = true, features = ["min_const_generics"] }
bytemuck_derive = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
helius-bn254 = { workspace = true, optional = true }
solana-bn254-mcl-sys = { workspace = true, optional = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { workspace = true }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }
solana-bn254 = { workspace = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
