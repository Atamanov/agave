[package]
name = "bn254-decision-groth16-guest"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["bpf-entrypoint"]
bpf-entrypoint = []

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "43fee1a67e91c0df7bb4edad5ba87ae4602aa208", features = ["bsb22"] }
pinocchio = "0.11"
solana-bn254 = "3.2.1"
solana-bn254-batch-syscall = { path = "../../../bn254-batch-syscall", default-features = false, features = ["agave-unstable-api"] }
solana-bn254-groth16-batch = { path = "../../../bn254-groth16-batch", default-features = false, features = ["agave-unstable-api"] }
solana-keccak-hasher = "3.1.0"
solana-sha256-hasher = "3.1.0"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_os, values(\"solana\"))"]
