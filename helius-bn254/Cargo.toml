[package]
name = "helius-bn254"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/helius/helius-bn254"
rust-version = "1.95.0"
description = "Variable-time BN254 batch arithmetic with portable and native backends"
readme = "README.md"
homepage = "https://github.com/helius/helius-bn254"
documentation = "https://docs.rs/helius-bn254"
keywords = ["bn254", "pairing", "zk", "elliptic-curve", "cryptography"]
categories = ["cryptography", "no-std"]

[features]
# The default build uses no_std with alloc.
default = []
std = []
force-portable = []
deny-ifma = []
force-ifma = []

[dependencies]
bytemuck = { version = "1.25", default-features = false, features = ["derive", "min_const_generics"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = { version = "=0.5.0", features = ["asm"] }
criterion = { version = "0.5", features = ["html_reports"] }
hex = "0.4"
rand = "=0.8.6"

[[bench]]
name = "pairing"
harness = false

[[bench]]
name = "field"
harness = false

[[bench]]
name = "agave_workloads"
harness = false

[[bench]]
name = "gt_map_scenarios"
harness = false

[package.metadata.docs.rs]
features = ["std", "deny-ifma"]
rustdoc-args = ["--cfg", "docsrs"]
