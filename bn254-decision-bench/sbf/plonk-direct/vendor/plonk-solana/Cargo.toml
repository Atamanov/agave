[package]
name = "plonk-solana"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
light-hasher = { version = "5.0", features = ["keccak"] }
thiserror = { version = "2", default-features = false }

[target.'cfg(target_os = "solana")'.dependencies]
pinocchio = "0.11"

[target.'cfg(not(target_os = "solana"))'.dependencies]
ark-ec = "0.5"
ark-serialize = "0.5"

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ["cfg(target_os, values(\"solana\"))"]
