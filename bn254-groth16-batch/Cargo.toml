[package]
name = "solana-bn254-groth16-batch"
description = "Reference batched Groth16 verifier over the alt_bn128 batch syscalls"
documentation = "https://docs.rs/solana-bn254-groth16-batch"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
no-default-features = true
features = ["agave-unstable-api", "backend-b1-arkworks"]

[features]
default = ["backend-b1-arkworks"]
agave-unstable-api = ["solana-bn254-batch-syscall/agave-unstable-api"]
research-observer = ["solana-bn254-batch-syscall/research-observer"]
backend-b1-arkworks = ["solana-bn254-batch-syscall/backend-b1-arkworks"]
backend-b2-arkworks-optimized = ["solana-bn254-batch-syscall/backend-b2-arkworks-optimized"]
backend-b3-mcl = ["solana-bn254-batch-syscall/backend-b3-mcl"]
backend-b4-helios = ["solana-bn254-batch-syscall/backend-b4-helios"]
backend-b5-helios-ifma = ["solana-bn254-batch-syscall/backend-b5-helios-ifma"]
# Exposes `test_utils` fixtures to dependent test suites.
test-fixtures = ["dep:ark-std"]

[dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false, optional = true }
solana-bn254-batch-syscall = { workspace = true }
solana-keccak-hasher = { workspace = true, features = ["sha3"] }
solana-bn254 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ark-std = { version = "0.5", default-features = false }

[lints]
workspace = true
